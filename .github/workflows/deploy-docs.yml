name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            test-docusaurus-site/yarn.lock

      - name: Install dependencies (root)
        run: yarn install --frozen-lockfile

      - name: Run BDD tests with HTML report
        run: yarn test:report

      - name: Install dependencies (docs site)
        working-directory: test-docusaurus-site
        run: yarn install --frozen-lockfile

      - name: Copy root docs to Docusaurus (single source of truth)
        run: ./copy-docs.sh

      - name: Start local Kroki stack
        run: docker compose -f docker-compose.kroki.yml up -d

      - name: Wait for local Kroki
        run: |
          for attempt in {1..30}; do
            if curl --silent --show-error http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.kroki.yml logs
          exit 1

      - name: Build documentation site
        working-directory: test-docusaurus-site
        run: yarn build
        env:
          NODE_ENV: production
          KROKI_BASE_URL: http://127.0.0.1:8000

      - name: Build Storybook
        run: yarn build:storybook

      - name: Copy Cucumber test report to build
        run: |
          mkdir -p test-docusaurus-site/build/test-results
          cp test-results/cucumber-report.html test-docusaurus-site/build/test-results/

      - name: Copy Storybook to build
        run: |
          mkdir -p test-docusaurus-site/build/storybook
          cp -r storybook-static/* test-docusaurus-site/build/storybook/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-docusaurus-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
